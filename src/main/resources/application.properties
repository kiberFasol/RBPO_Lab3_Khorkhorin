# ===== Server Configuration =====
server.port=${SERVER_PORT:8080}

# ===== Datasource Configuration (PostgreSQL) =====
# Учетные данные считываются из переменных окружения / файла .env
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dormitory_db}
spring.datasource.username=${DB_USERNAME:dorm_app_user}
spring.datasource.password=${DB_PASSWORD:dorm_secure_pass123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate Configuration =====
# Схема создана и поддерживается через init-db.sql; пользователь dorm_app_user не имеет DDL-прав
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Jackson JSON Serialization =====
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.deserialization.fail-on-unknown-properties=false
